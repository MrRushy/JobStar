spring.application.name=backend
spring.config.import=optional:file:./.env[.properties]
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/jobstar}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:jobstar-dev}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:Lax}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.storage.supabase.endpoint=${SUPABASE_STORAGE_ENDPOINT:}
app.storage.supabase.region=${SUPABASE_STORAGE_REGION:}
app.storage.supabase.access-key=${SUPABASE_STORAGE_ACCESS_KEY:}
app.storage.supabase.secret-key=${SUPABASE_STORAGE_SECRET_KEY:}
app.storage.supabase.bucket=${SUPABASE_STORAGE_BUCKET:resumes}
